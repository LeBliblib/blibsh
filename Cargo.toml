[workspace]
members = [
    "server",
    "client",
    "common",
]
resolver = "2"

[workspace.dependencies]
common = { path = "common" }
clap = { version = "4.5.60", features = ["derive"] }
rmp = "0.8.15"
rmp-serde = "1.3.1"
rmpv = "1.3.1"
rustls = "0.23.37"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-rustls = "0.26.4"
serde_json = "1.0.149"
rustls-pemfile = "2.2.0"
openssl = "0.10.79"
